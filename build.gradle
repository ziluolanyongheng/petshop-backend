plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.pet-shop'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

configurations {
    all*.exclude group: 'commons-logging', module: 'commons-logging'
}
// 火山大模型 SDK - 排除特定 converter

dependencies {
    implementation 'com.aliyun.oss:aliyun-sdk-oss:3.17.4' // 添加具体版本号
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    //implementation 'org.xerial:sqlite-jdbc'
    implementation 'mysql:mysql-connector-java:8.0.33'
    implementation 'com.mybatis-flex:mybatis-flex-codegen:1.8.3'
    implementation 'com.mybatis-flex:mybatis-flex-spring-boot3-starter:1.9.1'
    annotationProcessor 'com.mybatis-flex:mybatis-flex-processor:1.9.1'
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'com.auth0:java-jwt:3.4.0'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // 新增的Thymeleaf相关依赖
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6:3.1.2.RELEASE'
    // === 新增的 OAuth2 依赖 ===
    implementation 'org.springframework.security:spring-security-oauth2-client'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'org.springframework.security:spring-security-config' // 推荐添加
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    //websocket
    //implementation 'org.springframework.boot:spring-boot-starter-websocket'

    //邮件
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // 火山大模型 SDK - 排除特定 converter
    implementation("com.volcengine:volcengine-java-sdk-ark-runtime:0.2.16") {
        // 排除
        exclude group: 'io.swagger.core.v3', module: 'swagger-annotations'
    }

    //接口文档
    implementation("com.github.xiaoymin:knife4j-openapi3-jakarta-spring-boot-starter:4.4.0")

    // MinIO 依赖
    implementation 'io.minio:minio:8.5.14'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.2'
    // OkHttp 发送 HTTP 请求
    // implementation 'com.squareup.okhttp3:okhttp:4.8.1'

    // 根据扩展名取 MIME type
    implementation 'com.j256.simplemagic:simplemagic:1.17'


    // 支付宝SDK
    implementation 'com.alipay.sdk:alipay-sdk-java:3.7.73.ALL'
    // 支付宝SDK依赖的日志
    implementation 'commons-logging:commons-logging:1.2'
    //二维码生成
    implementation 'com.google.zxing:javase:3.3.3'

    //websocket
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
}

tasks.named('test') {
    useJUnitPlatform()
}
